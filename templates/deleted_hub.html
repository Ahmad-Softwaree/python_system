{% extends "base.html" %}
{% block title %}{{ t('nav.deleted') }} — {{ t('app.name') }}{% endblock %}

{% block content %}
<header class="mb-6 animate-fade-up">
  <h1 class="text-2xl sm:text-3xl font-bold text-brand-dark dark:text-teal-300 tracking-tight">{{ t('deleted.title') }}</h1>
  <p class="text-brand-muted dark:text-slate-400 text-sm mt-1">{{ t('deleted.subtitle') }}</p>
</header>

<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
  {% for key, info in tables.items() %}
  <a href="{{ url_for('deleted_table', name=key) }}"
     class="ui-card group p-5 animate-fade-up" style="animation-delay: {{ loop.index0 * 30 }}ms">
    <div class="flex items-start justify-between gap-3">
      <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 dark:bg-red-950 dark:text-red-300 grid place-items-center group-hover:bg-brand group-hover:text-white transition">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </div>
      <span class="text-2xl font-bold text-brand-dark dark:text-teal-300">{{ counts.get(key, 0) }}</span>
    </div>
    <h2 class="mt-4 font-semibold text-brand-dark dark:text-slate-100">{{ info.title }}</h2>
  </a>
  {% endfor %}
</section>
{% endblock %}
